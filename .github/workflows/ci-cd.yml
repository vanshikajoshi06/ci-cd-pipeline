
name: FastAPI CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test-and-push:
    name: Test and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Get source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configure Python
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 4. Run automated tests
      - name: Run Tests
        run: python -m pytest -v

      # 5. Configure Docker Buildx
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Build and push Docker image
      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-pipeline:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-pipeline:${{ github.sha }}

      # 8. Completion
      - name: Pipeline Completed
        run: echo "Tests passed and Docker image pushed successfully!"
